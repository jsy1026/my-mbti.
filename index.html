<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Arial", "Malgun Gothic", sans-serif;
      background: #fff7df;
      color: #4a3718;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 55px 0;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 58px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      color: #6b4b16;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 19px;
      color: #806b45;
    }

    .card {
      background: #fffdf5;
      border: 3px solid #f2d27a;
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 10px 25px rgba(116, 87, 30, 0.12);
    }

    .question {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
    }

    .mbti-btn {
      border: 2px solid #f1d88f;
      background: #fff5cf;
      color: #5e471e;
      border-radius: 15px;
      padding: 16px 8px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mbti-btn:hover {
      background: #ffe89b;
      transform: translateY(-3px);
      box-shadow: 0 5px 12px rgba(116, 87, 30, 0.12);
    }

    .result {
      display: none;
      text-align: center;
      animation: appear 0.4s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-type {
      display: inline-block;
      background: #f8d96e;
      color: #5b4213;
      border-radius: 30px;
      padding: 9px 22px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .pokemon-emoji {
      font-size: 120px;
      line-height: 1.2;
      margin: 5px 0;
    }

    .pokemon-name {
      font-size: 42px;
      margin: 8px 0 18px;
      color: #644713;
    }

    .reason {
      background: #fff3c7;
      border-radius: 18px;
      padding: 20px;
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .compatibility {
      background: #fffaf0;
      border: 2px dashed #e7c76b;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .compatibility-title {
      font-size: 18px;
      color: #8a6b2d;
      margin-bottom: 7px;
    }

    .compatibility-type {
      font-size: 27px;
      font-weight: bold;
      color: #654813;
    }

    .reset-btn {
      border: none;
      background: #e8b93f;
      color: white;
      border-radius: 15px;
      padding: 15px 35px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: #d9a92e;
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #9a865e;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 35px 0;
      }

      .card {
        padding: 23px 17px;
      }

      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .pokemon-emoji {
        font-size: 90px;
      }

      .pokemon-name {
        font-size: 34px;
      }

      .reason {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">⚡</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <div class="subtitle">
        나와 가장 어울리는 포켓몬은 누구일까?
      </div>
    </header>

    <div class="card">

      <!-- MBTI 선택 화면 -->
      <div id="selectScreen">
        <div class="question">
          ✨ 나의 MBTI를 골라보세요!
        </div>

        <div class="mbti-grid">
          <button class="mbti-btn" onclick="showResult('ISTJ')">ISTJ</button>
          <button class="mbti-btn" onclick="showResult('ISFJ')">ISFJ</button>
          <button class="mbti-btn" onclick="showResult('INFJ')">INFJ</button>
          <button class="mbti-btn" onclick="showResult('INTJ')">INTJ</button>

          <button class="mbti-btn" onclick="showResult('ISTP')">ISTP</button>
          <button class="mbti-btn" onclick="showResult('ISFP')">ISFP</button>
          <button class="mbti-btn" onclick="showResult('INFP')">INFP</button>
          <button class="mbti-btn" onclick="showResult('INTP')">INTP</button>

          <button class="mbti-btn" onclick="showResult('ESTP')">ESTP</button>
          <button class="mbti-btn" onclick="showResult('ESFP')">ESFP</button>
          <button class="mbti-btn" onclick="showResult('ENFP')">ENFP</button>
          <button class="mbti-btn" onclick="showResult('ENTP')">ENTP</button>

          <button class="mbti-btn" onclick="showResult('ESTJ')">ESTJ</button>
          <button class="mbti-btn" onclick="showResult('ESFJ')">ESFJ</button>
          <button class="mbti-btn" onclick="showResult('ENFJ')">ENFJ</button>
          <button class="mbti-btn" onclick="showResult('ENTJ')">ENTJ</button>
        </div>
      </div>

      <!-- 결과 화면 -->
      <div id="resultScreen" class="result">

        <div id="resultType" class="result-type"></div>

        <div id="pokemonEmoji" class="pokemon-emoji"></div>

        <h2 id="pokemonName" class="pokemon-name"></h2>

        <div id="reason" class="reason"></div>

        <div class="compatibility">
          <div class="compatibility-title">
            💛 잘 맞는 다른 유형
          </div>
          <div id="compatibility" class="compatibility-type"></div>
        </div>

        <button class="reset-btn" onclick="resetChoice()">
          🔄 다시 고르기
        </button>

      </div>

    </div>

    <div class="footer">
      ※ MBTI와 포켓몬의 재미있는 이미지를 바탕으로 만든 콘텐츠입니다.
    </div>

  </div>


  <script>
    const pokemonData = {

      ISTJ: {
        pokemon: "거북왕",
        emoji: "🐢",
        reason:
          "차분하고 책임감이 강한 ISTJ처럼 거북왕은 묵묵하게 자신의 역할을 해냅니다.<br>" +
          "계획적으로 움직이며 안정적인 상황을 좋아하는 모습이 잘 어울려요.",
        compatibility: "ESFP"
      },

      ISFJ: {
        pokemon: "해피너스",
        emoji: "🥚",
        reason:
          "ISFJ의 따뜻하고 다정한 성격은 다른 포켓몬을 돌보는 해피너스와 닮았습니다.<br>" +
          "주변 사람을 세심하게 챙기는 모습이 특히 잘 어울려요.",
        compatibility: "ENTP"
      },

      INFJ: {
        pokemon: "루카리오",
        emoji: "🐺",
        reason:
          "INFJ처럼 깊이 생각하고 자신의 신념을 중요하게 여기는 포켓몬입니다.<br>" +
          "상대방의 마음을 이해하고 조용히 자신의 길을 걸어가는 모습이 닮았어요.",
        compatibility: "ESTP"
      },

      INTJ: {
        pokemon: "메타그로스",
        emoji: "🤖",
        reason:
          "INTJ의 논리적이고 전략적인 사고방식과 메타그로스의 뛰어난 지능이 잘 어울립니다.<br>" +
          "목표를 세우고 효율적으로 해결책을 찾아가는 타입이에요.",
        compatibility: "ESFP"
      },

      ISTP: {
        pokemon: "핫삼",
        emoji: "🦀",
        reason:
          "ISTP처럼 침착하고 실용적인 핫삼은 필요한 순간 빠르게 행동합니다.<br>" +
          "말보다 행동으로 보여주는 스타일이라는 점이 잘 어울려요.",
        compatibility: "ENFJ"
      },

      ISFP: {
        pokemon: "가디안",
        emoji: "🧚",
        reason:
          "ISFP의 부드럽고 감성적인 면과 가디안의 섬세한 분위기가 잘 어울립니다.<br>" +
          "자신이 소중하게 생각하는 사람을 조용히 지켜주는 모습도 닮았어요.",
        compatibility: "ESTJ"
      },

      INFP: {
        pokemon: "이브이",
        emoji: "🦊",
        reason:
          "INFP의 자유로운 상상력과 독특한 개성이 이브이의 다양한 가능성과 닮았습니다.<br>" +
          "자신만의 방식으로 성장해 나가는 모습이 잘 어울려요.",
        compatibility: "ENTJ"
      },

      INTP: {
        pokemon: "후딘",
        emoji: "🦊",
        reason:
          "호기심이 많고 깊게 생각하는 INTP와 뛰어난 지능을 가진 후딘이 잘 어울립니다.<br>" +
          "새로운 원리를 알아가는 것을 좋아하는 탐구형 타입이에요.",
        compatibility: "ESFJ"
      },

      ESTP: {
        pokemon: "리자몽",
        emoji: "🐉",
        reason:
          "ESTP의 적극적이고 자신감 넘치는 성격은 리자몽의 강렬한 에너지와 닮았습니다.<br>" +
          "생각만 하기보다 직접 부딪혀 경험하는 것을 좋아하는 타입이에요.",
        compatibility: "INFJ"
      },

      ESFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason:
          "밝고 활발한 ESFP와 피카츄의 친근하고 에너지 넘치는 모습이 잘 어울립니다.<br>" +
          "주변 사람들과 함께 즐거운 시간을 만드는 것을 좋아하는 타입이에요.",
        compatibility: "ISTJ"
      },

      ENFP: {
        pokemon: "루기아",
        emoji: "🪽",
        reason:
          "ENFP의 자유로운 생각과 새로운 것을 향한 호기심이 루기아의 자유로운 이미지와 닮았습니다.<br>" +
          "새로운 가능성을 발견하는 것을 즐기는 타입이에요.",
        compatibility: "ISTJ"
      },

      ENTP: {
        pokemon: "뮤츠",
        emoji: "🧬",
        reason:
          "ENTP의 끊임없는 아이디어와 토론을 좋아하는 성향이 뮤츠의 강력한 지적 이미지와 잘 맞습니다.<br>" +
          "새로운 방법을 생각하고 기존의 틀에 도전하는 타입이에요.",
        compatibility: "ISFJ"
      },

      ESTJ: {
        pokemon: "마기라스",
        emoji: "🦖",
        reason:
          "ESTJ의 추진력과 책임감은 강력한 마기라스의 이미지와 잘 어울립니다.<br>" +
          "목표를 정하면 확실하게 실행하는 리더십이 돋보이는 타입이에요.",
        compatibility: "ISFP"
      },

      ESFJ: {
        pokemon: "토게키스",
        emoji: "🪽",
        reason:
          "ESFJ의 친절하고 사교적인 성격은 평화로운 분위기의 토게키스와 닮았습니다.<br>" +
          "사람들과 좋은 관계를 만들고 주변을 챙기는 것을 중요하게 생각해요.",
        compatibility: "INTP"
      },

      ENFJ: {
        pokemon: "파이어",
        emoji: "🔥",
        reason:
          "ENFJ의 따뜻한 리더십과 사람들에게 힘을 주는 모습이 파이어와 잘 어울립니다.<br>" +
          "주변 사람들에게 긍정적인 에너지를 전달하는 타입이에요.",
        compatibility: "ISTP"
      },

      ENTJ: {
        pokemon: "레쿠쟈",
        emoji: "🐉",
        reason:
          "ENTJ의 강한 목표 의식과 리더십은 레쿠쟈의 강력한 존재감과 잘 어울립니다.<br>" +
          "큰 목표를 세우고 자신 있게 앞으로 나아가는 타입이에요.",
        compatibility: "INFP"
      }
    };


    function showResult(type) {

      const data = pokemonData[type];

      document.getElementById("selectScreen").style.display = "none";
      document.getElementById("resultScreen").style.display = "block";

      document.getElementById("resultType").textContent =
        type + "에게 어울리는 포켓몬";

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.pokemon;

      document.getElementById("reason").innerHTML =
        data.reason;

      document.getElementById("compatibility").textContent =
        data.compatibility;
    }


    function resetChoice() {

      document.getElementById("resultScreen").style.display = "none";
      document.getElementById("selectScreen").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
